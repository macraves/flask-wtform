name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  library-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: library_app_production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: library_app_production/.python-version
          cache: pip
          cache-dependency-path: library_app_production/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  movie-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movie_web_app_multi_storage/moviewebapp_latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: movie_web_app_multi_storage/.python-version
          cache: pip
          cache-dependency-path: movie_web_app_multi_storage/requirements.txt
      - run: pip install -r ../requirements.txt pytest
      - run: python -m pytest tests -q -W ignore

  storage-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storage-app-user
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: storage-app-user/.python-version
          cache: pip
          cache-dependency-path: storage-app-user/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q
