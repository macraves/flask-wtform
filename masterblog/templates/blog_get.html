{% extends 'base.html' %}{% block content %}
<div class="card" style="width: 18rem">
	<div class="card-body">
		<h5 class="card-title">{{ blog.title }}</h5>
		<h6 class="card-subtitle mb-2 text-body-secondary">{{ blog.author }}</h6>
		<p class="card-text">{{ blog.content}}</p>
		{% if blog.get("like")%}
		<p class="card-text">{{ blog.like }}</p>
		{% endif %}
		<form
			method="POST"
			action="{{ url_for('blog.blog_like', idx=blog.id) }}"
			class="d-inline"
		>
			<input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
			<button type="submit" class="btn btn-primary">Like</button>
		</form>
		<a href="{{ url_for('blog.blog_update', idx=blog.id) }}" class="btn btn-warning"
			>Update</a
		>
		<form
			method="POST"
			action="{{ url_for('blog.blog_delete', idx=blog.id) }}"
			class="d-inline"
		>
			<input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
			<button type="submit" class="btn btn-danger">Delete</button>
		</form>
	</div>
</div>
{% endblock %}
